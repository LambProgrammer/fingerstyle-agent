services:
  # ---- API 服务 ----
  api:
    image: lambprogrammer/fingerstyle-agent:v1.0
    container_name: fingerstyle-api
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-fingerstyle-agent}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-fingerstyle}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fingerstyle_dev_pw}
      - POSTGRES_DB=${POSTGRES_DB:-fingerstyle}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    volumes:
      # RAG 搜索命中后需要读取 data/ 下的 MIDI 源文件
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    restart: unless-stopped

  # ---- PostgreSQL（短期记忆 Checkpointer，里程碑 8 使用）----
  postgres:
    image: postgres:16-alpine
    container_name: fingerstyle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fingerstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fingerstyle_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fingerstyle}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fingerstyle} -d ${POSTGRES_DB:-fingerstyle}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Redis（长期记忆 Store，里程碑 8 使用）----
  redis:
    image: redis:7-alpine
    container_name: fingerstyle-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # ---- Chroma（RAG 向量库，里程碑 5 使用）----
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: fingerstyle-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/rag:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
