name: CD

on:
  push:
    tags:
      - "v*" # 仅 tag push 触发（如 v1.0），普通 push 不触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fingerstyle-agent:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/fingerstyle-agent:latest
